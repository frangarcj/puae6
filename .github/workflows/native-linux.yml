name: Native Linux
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native O2 headless, libretro and cold restore
        run: python3 tools/ci/linux_native.py
