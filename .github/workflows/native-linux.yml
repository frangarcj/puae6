name: Native matrix
on:
  workflow_dispatch:
    inputs:
      variants:
        description: All combinations or sanitizer follow-up
        type: choice
        options: [all, san]
        default: all
permissions:
  contents: read
concurrency:
  group: native-linux
  cancel-in-progress: false
jobs:
  native:
    name: ${{ matrix.platform.row }} / ${{ matrix.optimization }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        optimization: [O0, O2, san]
        exclude: ${{ fromJSON(inputs.variants == 'san' && '[{"optimization":"O0"},{"optimization":"O2"}]' || '[]') }}
        platform:
          - row: macos-arm64-appleclang
            runner: macos-15
          - row: linux-arm64-clang
            runner: ubuntu-24.04-arm
          - row: linux-arm64-gcc
            runner: ubuntu-24.04-arm
          - row: linux-x86_64-clang
            runner: ubuntu-24.04
          - row: linux-x86_64-gcc
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Headless, libretro and cold restore
        run: python3 tools/ci/linux_native.py --row '${{ matrix.platform.row }}' --opt '${{ matrix.optimization }}'
