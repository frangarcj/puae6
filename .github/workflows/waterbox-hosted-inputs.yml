name: Waterbox pinned hosted inputs
on:
  push:
    branches: [codex/waterbox-hosted-inputs, codex/waterbox-hosted-gate]
    paths: [.github/workflows/waterbox-hosted-inputs.yml, .github/actions/**, tools/ci/**, tools/build_waterbox.py, tests/waterbox-smoke/**]
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, tools, managed, gate, clean, sanitizers, rgb565-probe]
        default: all
        required: true
permissions:
  contents: read
jobs:
  pinned-inputs:
    if: github.event_name == 'push' || (inputs.component != 'managed' && inputs.component != 'clean' && inputs.component != 'sanitizers')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify host and select an existing Ruby
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys
          assert sys.version_info >= (3, 12), 'Python >=3.12 required; no implicit install'
          assert (platform.system(), platform.machine(), os.sysconf('SC_PAGE_SIZE')) == ('Darwin', 'arm64', 16384)
          assert int(platform.mac_ver()[0].split('.')[0]) >= 26
          lock = json.loads(pathlib.Path('plan/toolchains.json').read_text())
          make = lock['toolchain_profiles']['hosted-macos26']['tools']['make']
          assert hashlib.sha256(pathlib.Path(make['path']).read_bytes()).hexdigest() == make['sha256']
          assert subprocess.check_output([make['path'], '--version'], text=True).splitlines()[0] == make['version']
          for candidate in ['/opt/homebrew/opt/ruby/bin/ruby', '/opt/homebrew/opt/ruby@3.4/bin/ruby', '/opt/homebrew/opt/ruby@3.3/bin/ruby', 'ruby']:
              ruby = shutil.which(candidate)
              if ruby and subprocess.run([ruby, '-e', 'exit((RUBY_VERSION.split(".").map(&:to_i) <=> [3,3]) == -1 ? 2 : 0)']).returncode == 0:
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('P6_HOSTED_RUBY=' + ruby + '\n')
                  print(json.dumps(dict(status='PASS', scope='host preflight only', ruby=ruby, macos=platform.mac_ver()[0])))
                  break
          else:
              raise SystemExit('BLOCKED: existing Ruby >=3.3 required; no implicit install')
          PY
      - name: Prepare authenticated compiler bottles as data
        shell: bash
        run: python3 -B tools/ci/prepare_hosted_tools.py --fetch --ruby "$P6_HOSTED_RUBY"
      - name: Prepare the fixed offline managed feed
        if: inputs.component != 'rgb565-probe'
        shell: bash
        run: python3 -B tools/ci/prepare_managed_inputs.py --fetch
      - name: Execute the pinned host tools with their verified libraries
        if: inputs.component != 'rgb565-probe'
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('hosted', root / 'tools/ci/prepare_hosted_tools.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          output = helper.prepare()
          manifest, _ = helper.inputs()
          lock = json.loads((root / 'plan/toolchains.json').read_text())
          paths = json.loads((output / 'paths.json').read_text())['paths']
          env = {**os.environ, 'DYLD_LIBRARY_PATH': ':'.join(str(output / p) for p in manifest['library_directories'])}
          versions = {}
          for name in ('clang', 'lld', 'cargo', 'rustc'):
              result = subprocess.run([paths[name], '--version'], env=env, text=True, capture_output=True, check=True, timeout=60)
              versions[name] = result.stdout.splitlines()[0].strip()
              assert versions[name] == lock['tools'][name]['version'], (name, versions[name])
          for name, argument, relative in [('clang', '-print-resource-dir', 'llvm/23.1.4/lib/clang/23'), ('rustc', '--print=sysroot', 'rust/1.99.1')]:
              observed = subprocess.check_output([paths[name], argument], env=env, text=True, timeout=60).strip()
              assert pathlib.Path(observed).resolve(strict=True) == (output / relative).resolve(strict=True), (name, observed)
          import struct, sys
          sys.path.insert(0, str(root / 'tools'))
          from ci import hosted_environment
          selected = hosted_environment.select({name: pathlib.Path(value) for name, value in paths.items()},
              {**os.environ, 'P6_WATERBOX_HOSTED_TOOLS': 'build/hosted-tools'})
          smoke = root / 'build/hosted-tool-check'
          smoke.mkdir()
          (smoke / 'own.c').write_text('int p6_c(int x) { return x + 1; }\n')
          (smoke / 'own.cpp').write_text('template<class T> T twice(T x) { return x+x; } int p6_cpp(int x) { return twice(x); }\n')
          (smoke / 'own.rs').write_text('#![no_std]\npub fn p6_rust(x: u32) -> u32 { x.wrapping_add(1) }\n')
          flags = '--target=aarch64-linux-gnu -ffixed-x18 -ffixed-x28'
          (smoke / 'Makefile').write_text('all:\n'
              + '\tclang ' + flags + ' -c own.c -o c.o\n'
              + '\tclang++ ' + flags + ' -c own.cpp -o cpp.o\n'
              + '\tld.lld -r c.o cpp.o -o combined.o\n'
              + '\t"$(RUSTC)" --crate-name p6_tool_smoke --crate-type lib --emit=metadata own.rs -o own.rmeta\n')
          subprocess.run(['/usr/bin/make'], cwd=smoke, env=selected['tool_env'], check=True, timeout=120)
          header = (smoke / 'combined.o').read_bytes()[:64]
          assert header[:4] == b'\x7fELF' and struct.unpack_from('<H', header, 18)[0] == 183
          assert (smoke / 'own.rmeta').stat().st_size > 0
          print(json.dumps(dict(status='PASS', scope='pinned host tools, resources and SIP-safe tiny compile/link only; no Waterbox build or execution', versions=versions), sort_keys=True))
          PY
      - name: Diagnose the pinned LLVM sanitizer loader with one own program
        if: inputs.component == 'rgb565-probe'
        env:
          P6_WATERBOX_SOURCE_AUDIT: snapshot
          P6_WATERBOX_TOOLCHAIN_PROFILE: hosted-macos26
          P6_WATERBOX_TOOLS_FILE: build/hosted-tools/paths.json
          P6_WATERBOX_HOSTED_TOOLS: build/hosted-tools
        run: python3 -B -m tools.ci.rgb565_loader_probe
      - name: Prepare the exact managed SDK for the full gate
        if: inputs.component == 'gate' || github.ref == 'refs/heads/codex/waterbox-hosted-gate'
        uses: ./.github/actions/prepare-managed-sdk
      - name: Select the verified hosted Waterbox inputs
        if: inputs.component == 'gate' || github.ref == 'refs/heads/codex/waterbox-hosted-gate'
        shell: bash
        run: |
          printf '%s\n' 'P6_WATERBOX_SOURCE_AUDIT=snapshot' 'P6_WATERBOX_TOOLCHAIN_PROFILE=hosted-macos26' 'P6_WATERBOX_TOOLS_FILE=build/hosted-tools/paths.json' 'P6_WATERBOX_HOSTED_TOOLS=build/hosted-tools' 'P6_WATERBOX_MANAGED_FEED=build/hosted-managed-feed' 'CMAKE_BUILD_PARALLEL_LEVEL=2' 'CARGO_HTTP_CAINFO=/etc/ssl/cert.pem' 'SSL_CERT_FILE=/etc/ssl/cert.pem' >> "$GITHUB_ENV"
          python3 -B tools/prepare_waterbox_sysroot.py
      - name: Build and execute the real Waterbox runtime smoke
        if: inputs.component == 'gate' || github.ref == 'refs/heads/codex/waterbox-hosted-gate'
        shell: bash
        run: python3 -B tools/build_waterbox.py --source-audit snapshot --fetch --smoke --jobs 2
      - name: Build the complete ARM64 guest
        if: inputs.component == 'gate' || github.ref == 'refs/heads/codex/waterbox-hosted-gate'
        shell: bash
        run: |
          python3 -B tools/generate_cpu.py
          python3 -B tools/build_waterbox.py --source-audit snapshot --puae6 --jobs 2
      - name: Execute all checks of the public PR recipe
        if: inputs.component == 'gate' || github.ref == 'refs/heads/codex/waterbox-hosted-gate'
        shell: bash
        run: python3 -B tools/ci/run.py --source-audit snapshot
  managed-sdk:
    if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'managed')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare and select the pinned project-local SDK
        uses: ./.github/actions/prepare-managed-sdk
      - name: Prepare the fixed offline managed feed
        shell: bash
        run: python3 -B tools/ci/prepare_managed_inputs.py --fetch
      - name: Verify exact SDK and restore using only the fixed local feed
        shell: bash
        run: |
          export DOTNET_ROOT="$PWD/build/hosted-dotnet"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export DOTNET_CLI_HOME="$PWD/build/hosted-dotnet-home"
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1
          export NUGET_PACKAGES="$PWD/build/hosted-managed-packages"
          sdk="$DOTNET_ROOT/dotnet"
          feed="$PWD/build/hosted-managed-feed"
          cd tests/ffi
          test "$("$sdk" --version)" = 10.0.402
          "$sdk" restore Ffi.csproj --source "$feed" --packages "$NUGET_PACKAGES" --nologo
          echo 'PASS: exact project-local SDK and managed offline restore; no core compilation or Waterbox execution'
  clean:
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'clean'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      P6_WATERBOX_TOOLCHAIN_PROFILE: hosted-macos26
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute and validate the complete clean lane
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, subprocess, sys
          from tools.ci import nightly
          lane = 'clean'
          process = subprocess.run([sys.executable, '-B', 'tools/ci/nightly.py', '--source-audit', 'snapshot', '--lane', lane],
                                   text=True, stdout=subprocess.PIPE)
          print(process.stdout, end='')
          verdict = json.loads(process.stdout.strip().splitlines()[-1])
          nightly.validate_result(verdict, lane)
          raise SystemExit(process.returncode or (0 if verdict['status'] == 'PASS' else 1))
          PY
  sanitizers:
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'sanitizers'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      P6_WATERBOX_TOOLCHAIN_PROFILE: hosted-macos26
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute and validate the complete sanitizers lane
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, subprocess, sys
          from tools.ci import nightly
          lane = 'sanitizers'
          process = subprocess.run([sys.executable, '-B', 'tools/ci/nightly.py', '--source-audit', 'snapshot', '--lane', lane],
                                   text=True, stdout=subprocess.PIPE)
          print(process.stdout, end='')
          verdict = json.loads(process.stdout.strip().splitlines()[-1])
          nightly.validate_result(verdict, lane)
          raise SystemExit(process.returncode or (0 if verdict['status'] == 'PASS' else 1))
          PY
